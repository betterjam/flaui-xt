feature: Calendar
description: >
  Appointment-book / scheduler for service businesses: a month calendar (frmCalendar),
  a day grid of staff time slots (frmDay), the create/edit-appointment panel (frmCreate)
  with its service selection, move/clone and check-out flows, plus the filter (frmFilter),
  legend (frmLegend), conflict print (frmConflict) and multi-appointment check-out select
  (frmSelect) dialogs. No existing Ranorex coverage touches a Calendar folder - this catalog
  is net-new and grounded only in the Calendar/*.cs forms. There are no #if build-flavor
  branches in Calendar/*.cs, so flavors is empty for every case.
source_paths:
  - 2.0.x/Calendar
flavors: []          # no #if (CFD|BO|DEMO|TRAINING) branches in Calendar/*.cs alter user-facing flow

test_cases:
  # ----------------------------------------------------------------------------
  # frmCalendar.cs - month calendar navigation (entity: Appointment)
  # ----------------------------------------------------------------------------
  - id: CAL-001
    title: Cancel a pending appointment move from the month calendar
    kind: atomic
    priority: P2
    type: e2e
    flavors: []
    categories:
      test_kind: setting-behavior
      ui_area: frmCalendar
      entity: Appointment
    preconditions:
      - Logged in as admin with Calendar access
      - An appointment move is in progress (btnCancel "Cancel Move" is visible)
      - The month calendar (frmCalendar) is shown
    steps:
      - Click the "Cancel Move" button on the month calendar
    expected:
      - The Cancel Move button is hidden
      - The day view's pending move is cancelled (frmDay.CancelMove)
    runner: ranorex
    composes: [StartAUT, LoginAsAdminUser, GoToModule, CloseAUT]
    reference_recordings: [StartAUT, LoginAsAdminUser, GoToModule]
    binding: needs-recording
    matches_existing: null
    new_controls:
      - Calendar module tile on the main menu
      - frmCalendar btnCancel ("Cancel Move")
    source_files:
      - 2.0.x/Calendar/frmCalendar.cs
      - 2.0.x/Calendar/frmDay.cs
    evidence:
      - { file: 2.0.x/Calendar/frmCalendar.cs, line: 131, text: "btnCancelClick" }
    flow_hash: "6CE4CAA5F87FA933"
    source_refs: { tickets: [], prs: [] }
    origin: discovery

