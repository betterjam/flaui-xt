feature: Staff
description: >
  Staff management module: staff list/search, staff record CRUD (PIN/card credentials,
  validation), per-staff services, staff & renter payouts, the time-clock manager, and
  the weekly work-schedule editor. Grounded in 2.0.x/Staff. Every test case cites a code
  anchor from catalog/_baseline/evidence-Staff.json verbatim.
source_paths:
  - 2.0.x/Staff
flavors: [CFD, BO, DEMO, TRAINING]

test_cases:

  # =====================================================================
  # frmList - staff list, search-result grid, print/report, permissions
  # =====================================================================
  - id: STAFF-001
    title: Staff module requires the Staff access right to open
    kind: atomic
    priority: P1
    type: integration
    flavors: [CFD]
    categories:
      test_kind: permission
      ui_area: frmList
      entity: Staff
    preconditions:
      - A staff/user account exists WITHOUT the "Staff" access right
      - A staff/user account exists WITH the "Staff" access right
    steps:
      - Log in as a user lacking the "Staff" right
      - Attempt to open the Staff list (frmList)
      - Log in as a user holding the "Staff" right and reopen the Staff list
    expected:
      - Access is denied / the Staff list is blocked for the user without the right
      - The Staff list opens for the user holding the "Staff" right
    runner: nunit
    composes: []
    reference_recordings: []
    binding: needs-recording
    matches_existing: null
    new_controls:
      - frmList access-right gate on _AccessObj (Staff)
    source_files:
      - 2.0.x/Staff/frmList.cs
    evidence:
      - { file: 2.0.x\Staff\frmList.cs, line: 43, text: "perm:Staff" }
    flow_hash: "7C04DA30846F9F8C"
    source_refs: { tickets: [], prs: [] }
    origin: discovery

