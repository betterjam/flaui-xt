feature: Main
description: >
  Main module forms under 2.0.x/Main: the app shell (frmMain), main menu (frmMenu),
  lock screen (frmLock), dashboard charting (frmDashBoard), POS-type selector
  (frmSelect), remote support (frmSupport), recovery console (frmRecover), and startup
  (Start). One atomic case per code anchor (message/action/toggle/permission);
  composites chain a form's atomics into a realistic open->act flow. Locators are
  referenced from existing recordings, never fabricated.
source_paths:
  - 2.0.x/Main
flavors: []

