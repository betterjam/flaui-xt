feature: Items
description: >
  Item, category, matrix, service, promotion, coupon, label, fresh-sheet, inventory-count
  and bulk modify-all flows for the Exatouch Items module. Net-new catalog grounded in the
  2.0.x/Items/*.cs forms (and Items/Services/*.cs). No existing Ranorex recordings target these
  forms directly; cases reference the generic Items building-block recordings as locator ground.
source_paths:
  - 2.0.x/Items
flavors: []          # no #if (CFD|BO|DEMO|TRAINING) branch in Items/*.cs alters the user-facing flows enumerated here

test_cases:
  - id: ITEM-001
    title: Reject new category save when Description is blank
    kind: atomic
    priority: P1
    type: e2e
    flavors: []
    categories:
      test_kind: validation
      ui_area: frmCategory
      entity: Category
    preconditions:
      - Logged in as admin with Items > Categories access
      - Category editor open on a new row with Description left empty
    steps:
      - Open Items > Categories
      - Add a new category and leave the Description field blank
      - Attempt to save the row
    expected:
      - Warning dialog displays "Description cannot be blank"
    runner: ranorex
    composes: [StartAUT, LoginAsAdminUser, GoToModule, CloseAUT]
    reference_recordings: [StartAUT, LoginAsAdminUser, GoToModule]
    binding: needs-recording
    matches_existing: null
    new_controls:
      - Categories grid
      - Category Description text field
      - Save button
    source_files:
      - 2.0.x/Items/frmCategory.cs
    evidence:
      - { file: 2.0.x/Items/frmCategory.cs, line: 127, text: "Description cannot be blank" }
    flow_hash: "ECE22AF30A13C627"
    source_refs: { tickets: [], prs: [] }
    origin: discovery
