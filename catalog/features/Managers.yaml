feature: Managers
description: >
  Business-logic manager classes under 2.0.x/Managers. These are not forms; each public
  manager method is an exercisable behavior, so coverage is one NUnit case per method anchor
  (file:line). calc-methods -> unit calculation tests; other methods -> integration tests
  asserting the documented return/behavior. Composites chain a manager's atomics into a
  realistic lifecycle. No Ranorex locators are authored here; these run under the NUnit runner
  against the manager API, so composes/reference_recordings stay empty and matches_existing is
  null (net-new coverage the recorded suite lacks). Evidence text is the verbatim method
  signature copied from catalog/_baseline/evidence-Managers.json.
source_paths:
  - 2.0.x/Managers
flavors: []

