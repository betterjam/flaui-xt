description: >
  Settings module forms under 2.0.x/Settings: access profiles, account, company,
  preferences, printers, taxes, tenders, and device setup. One atomic case per code
  anchor (message/action/toggle/permission); composites chain a form's atomics into a
  realistic open->act->save flow. Locators are referenced from existing recordings,
  never fabricated.
