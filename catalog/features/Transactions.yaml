feature: Transactions
description: >
  Point-of-sale order entry, tender, refund/void, payouts, discounts, and receipt
  flows under 2.0.x/Transactions. One atomic case per code anchor
  (message/action/toggle/permission/calc); composites chain realistic flows.
  Locators are referenced from existing recordings, never fabricated.
source_paths:
  - 2.0.x/Transactions
flavors: []

test_cases:
  # ------------------------------------------------------------------------
  # frmRefund.cs - refund / void an order, refund tender, recreate order
  # ------------------------------------------------------------------------
  - id: TXN-0001
    title: "frmRefund: Warning - Failed to load order"
    kind: atomic
    priority: P2
    type: e2e
    flavors: []
    categories:
      test_kind: error-guard
      ui_area: frmRefund
      entity: Order
    preconditions:
      - Logged in as admin
    steps:
      - Open Refund and request an order id that cannot be loaded
      - Observe the dialog text
    expected:
      - "Dialog text is: Failed to load order # : {MainID}"
    runner: ranorex
    composes: [StartAUT, LoginAsAdminUser, GoToRegister, CloseAUT]
    reference_recordings: [StartAUT, LoginAsAdminUser, GoToRegister]
    binding: needs-recording
    matches_existing: null
