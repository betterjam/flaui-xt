feature: Purchasing
description: >
  Vendor management, purchase-order creation/auto-generation/completion, PO emailing,
  and receiving stock into inventory. No existing Ranorex coverage (0 recordings under a
  Purchasing folder) - this catalog is net-new and grounded in the Purchasing/*.cs forms.
source_paths:
  - 2.0.x/Purchasing
flavors: []          # no #if (CFD|BO|DEMO|TRAINING) branches in Purchasing/*.cs alter user-facing flow

test_cases:
  # ----------------------------------------------------------------------------
  # frmVendors.cs - Vendor create / save / delete / history (entity: Vendor)
  # ----------------------------------------------------------------------------
  - id: PUR-001
    title: Save a new vendor with required contact info succeeds
    kind: atomic
    priority: P1
    type: e2e
    flavors: []
    categories:
      test_kind: happy-path
      ui_area: frmVendors
      entity: Vendor
    preconditions:
      - Logged in as admin with Purchasing > Vendors access
    steps:
      - Go to the Purchasing module and open New Vendor
      - Enter a company name in txtName
      - Enter a phone number in ucPhone1
      - Save the record via the nav Save
    expected:
      - "Success message is shown: Saved successfully."
      - Vendor is persisted and Delete/History buttons become enabled
    runner: ranorex
    composes: [StartAUT, LoginAsAdminUser, GoToModule, SaveRecord, CloseAUT]
    reference_recordings: [StartAUT, LoginAsAdminUser, GoToModule, SaveRecord]
    binding: needs-recording
    matches_existing: null
    new_controls:
      - Purchasing module tile on the main menu (frmMenu)
      - frmMenu btnVendorNew button
      - frmVendors txtName, ucPhone1, txtEmail, nav Save (ucNav)
    source_files:
      - 2.0.x/Purchasing/frmVendors.cs
      - 2.0.x/Purchasing/frmMenu.cs
    evidence:
      - { file: 2.0.x/Purchasing/frmVendors.cs, line: 384, text: "Saved successfully." }
    flow_hash: "E37AE3B281FE2160"
    source_refs: { tickets: [], prs: [] }
    origin: discovery

