feature: Integrations
description: >
  Integrations module forms under 2.0.x/Integrations: FloorPlan (table/section
  layout and live status), Kiosk (loyalty check-in/join), LCB and LMP (state
  tobacco/liquor reporting + Master Service price sync), Messages (email/birthday/
  reminder campaigns and distribution lists), and ScanData (Altria/RJR scan upload).
  One atomic case per code anchor (message/action/toggle/permission); composites
  chain a form's atomics into a realistic open->act->save flow. Locators are
  referenced from existing recordings, never fabricated.
source_paths:
  - 2.0.x/Integrations
flavors: []

