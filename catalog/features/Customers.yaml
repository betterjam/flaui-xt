feature: Customers
description: >
  Customer master record, club / club-member, customer search & list, notes, info,
  statements and transactions flows for the Exatouch Customers module. Net-new catalog
  grounded in the 2.0.x/Customers/*.cs forms. Customer-specific Ranorex building blocks
  (GoToCustomers, GoToCustomerDetails, SearchForCustomerByName, SearchCustomerByPhone,
  Insert* field recordings, SaveRecord) are referenced as locator ground; net-new controls
  on the club/notes/info/statements forms are flagged for a record pass.
source_paths:
  - 2.0.x/Customers
flavors: []          # no #if (CFD|BO|DEMO|TRAINING) branch in Customers/*.cs alters the user-facing flows enumerated here

