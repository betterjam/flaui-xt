feature: SysForms
description: >
  Shared system dialogs and customer-facing-display (CFD) prompts used across Exatouch:
  address picker, criteria/date-range/date-time pickers, image & color pickers, init-display
  guard, label/notes editors, lock & login screens, merchant confirm, generic message box,
  numeric value pad, phone prompt, picture viewer, popup, access-card reader, generic
  search/browse, success/wait/waiting overlays, and the CFD receipt/email/phone/tip flows.
  Every case is grounded in a deterministic code anchor from
  catalog/_baseline/evidence-SysForms.json (the extract-evidence.ps1 output over 2.0.x/SysForms);
  message text is copied verbatim from that anchor. These are dialog building blocks invoked
  by many modules, so most cases are needs-recording (net-new controls) and reference the
  generic StartAUT/LoginAsAdminUser/GoToModule building blocks where a flow precedes the dialog.
source_paths:
  - 2.0.x/SysForms
flavors: [CFD]        # 2.0.x/SysForms/CFD/* are customer-facing-display prompt forms

test_cases:
