feature: Utility
description: >
  Back-office Utility module of Exatouch: database backup/restore/recover, USB drive
  selection & verification, data export/import (including setup-file download from S3
  buckets and customer bulk upload), license reactivation, wireless network connection,
  print-queue clearing, training-mode switch, system-time set, internet test, and the
  Utility main menu that gates each tool behind a Utilities.* permission. Every case is
  grounded in a deterministic code anchor from catalog/_baseline/evidence-Utility.json
  (the extract-evidence.ps1 output over 2.0.x/Utility); message text is copied verbatim
  from that anchor. The Utility forms are reached from the main menu Utility module and
  use the generic StartAUT/LoginAsAdminUser/GoToModule building blocks; their dialog
  controls are net-new, so most e2e cases are needs-recording.
source_paths:
  - 2.0.x/Utility
flavors: []

test_cases:
  # ============================================================================
  # frmBackUp.cs - manual database backup dialog (entity: Backup)
  # ============================================================================
  - id: UTIL-001
    title: Declining the backup confirmation aborts the backup
    kind: atomic
    priority: P2
    type: e2e
    flavors: []
    categories:
      test_kind: error-guard
      ui_area: frmBackUp
      entity: Backup
    preconditions:
      - Logged in as admin
      - The backup dialog is open
    steps:
      - Start a backup
      - Decline the backup confirmation prompt
    expected:
      - 'A warning is shown: "Backup declined."'
      - The backup does not proceed
    runner: ranorex
    composes: [StartAUT, LoginAsAdminUser, GoToModule, CloseAUT]
    reference_recordings: [StartAUT, LoginAsAdminUser, GoToModule]
    binding: needs-recording
    matches_existing: null
    new_controls:
      - frmBackUp backup confirmation prompt
    source_files:
      - 2.0.x/Utility/frmBackUp.cs
    evidence:
